    <linearGradient id="g-neck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#5c3d2e" />
      <stop offset="50%" stopColor="#8b6f47" />
      <stop offset="100%" stopColor="#5c3d2e" />
