  <circle cx="150" cy="75" r="12" fill="#2ecc40" stroke="#111" stroke-width="1.5" />
  <circle cx="175" cy="75" r="12" fill="#e74c3c" stroke="#111" stroke-width="1.5" />
  <circle cx="200" cy="75" r="12" fill="#f1c40f" stroke="#111" stroke-width="1.5" />
  <circle cx="225" cy="75" r="12" fill="#3498db" stroke="#111" stroke-width="1.5" />
  <circle cx="250" cy="75" r="12" fill="#e67e22" stroke="#111" stroke-width="1.5" />

  <!-- Strum Bar -->
