<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="df-grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#1a1a2e" />
      <stop offset="50%" stopColor="#16213e" />
      <stop offset="100%" stopColor="#0f3460" />
    </linearGradient>
    <linearGradient id="df-grad-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#e94560" />
      <stop offset="100%" stopColor="#ff6b81" />
    </linearGradient>
    <filter id="df-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded hexagon / shield -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#df-grad-bg)" stroke="#e94560" stroke-width="6" />

  <!-- Controller D-Pad Silhouette -->
  <g transform="translate(140, 160)">
    <path d="M 40,0 L 70,0 L 70,40 L 110,40 L 110,70 L 70,70 L 70,110 L 40,110 L 40,70 L 0,70 L 0,40 L 40,40 Z" fill="#2e3856" stroke="#4a5578" stroke-width="3" />
    <polygon points="55,10 47,24 63,24" fill="#a4b0be" />
    <polygon points="55,100 47,86 63,86" fill="#a4b0be" />
    <polygon points="10,55 24,47 24,63" fill="#a4b0be" />
    <polygon points="100,55 86,47 86,63" fill="#a4b0be" />
  </g>

  <!-- Anvil / Forge Accent Hammer Flame -->
  <g transform="translate(250, 130)" filter="url(#df-glow)">
    <!-- Stylized Anvil / Diamond Buttons -->
    <circle cx="90" cy="50" r="16" fill="url(#df-grad-accent)" />
    <circle cx="50" cy="90" r="16" fill="url(#df-grad-accent)" />
    <circle cx="130" cy="90" r="16" fill="url(#df-grad-accent)" />
    <circle cx="90" cy="130" r="16" fill="url(#df-grad-accent)" />
  </g>

  <!-- Brand Title -->
  <text x="256" y="380" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="6">
    DECKFORGE
  </text>
  <text x="256" y="415" text-anchor="middle" fill="#e94560" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="8">
    INPUT STUDIO
  </text>
</svg>
